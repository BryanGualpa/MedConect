version: '3.8'

# MedConnect — Docker Compose
# Arquitectura: frontend (React 18 / Nginx) + backend (Node.js 20 + Express.js) + db (PostgreSQL 16)
# Ref: Documento de Arquitectura de Software — Anexo F

services:
  # ─── BASE DE DATOS ───────────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: medconnect_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medconnect_db
      POSTGRES_USER: medconnect_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medconnect_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - medconnect_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medconnect_user -d medconnect_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── BACKEND (Node.js 20 + Express.js) ───────────────────────────────────────
  backend:
    build:
      context: ./medconnect-backend
      dockerfile: Dockerfile
    container_name: medconnect_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://medconnect_user:${DB_PASSWORD:-medconnect_dev_password}@db:5432/medconnect_db
      JWT_SECRET: ${JWT_SECRET:-medconnect-dev-secret-minimo-32-caracteres-2026}
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 30d
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    ports:
      - "5000:5000"
    volumes:
      - ./medconnect-backend:/app
      - /app/node_modules
    networks:
      - medconnect_net

  # ─── FRONTEND (React 18 / Nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./medconnect-frontend
      dockerfile: Dockerfile
    container_name: medconnect_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - medconnect_net

# ─── VOLÚMENES Y REDES ─────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local

networks:
  medconnect_net:
    driver: bridge
